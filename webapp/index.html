<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кейсы CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,600;0,800;1,800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">КЕЙСЫ<span>CS2</span></div>
    <button class="energy" id="energy" type="button" title="Бесплатные спины">⚡ <b id="energy-value">0/3</b></button>
    <button class="balance" id="balance" type="button" aria-label="Баланс">
      <b id="balance-value">0 ₽</b><small id="balance-label">игровые</small>
    </button>
  </header>
  <div class="live" id="live" aria-label="Последние дропы"></div>

  <main id="screens">
    <!-- КЕЙСЫ -->
    <section class="screen" id="screen-cases" data-tab="cases">
      <div id="case-list-view" class="screen">
        <div class="banners" id="banners" hidden></div>
        <div class="quick" id="quick"></div>
        <div class="chips" id="cat-chips"></div>
        <div id="case-groups"></div>
      </div>
      <div id="case-view" class="screen" hidden></div>
    </section>

    <!-- АПГРЕЙДЫ -->
    <section class="screen" id="screen-upgrade" data-tab="upgrade" hidden>
      <div class="up-board">
        <div class="up-slot" id="up-stake">
          <small>Ставка</small><div class="up-items" id="up-stake-items"><span class="plus">+</span></div><b id="up-stake-sum">0 ₽</b>
        </div>
        <div class="up-dial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" class="dial-track"/>
            <circle cx="60" cy="60" r="50" class="dial-arc" id="up-arc" pathLength="1000" stroke-dasharray="0 1000"/>
            <g id="up-needle"><line x1="100" y1="60" x2="118" y2="60"/></g>
          </svg>
          <div class="dial-val"><b id="up-chance">0%</b><small>шанс</small></div>
        </div>
        <div class="up-slot" id="up-target">
          <small>Цель</small><div class="up-items" id="up-target-items"><span class="plus">?</span></div><b id="up-target-sum">—</b>
        </div>
      </div>
      <p class="formula" id="up-formula"></p>
      <button class="btn-spin small" id="up-go" type="button" disabled><span>АПГРЕЙД</span></button>
      <div class="seg small" id="up-seg">
        <button type="button" data-side="stake" class="on">1. Ставка</button>
        <button type="button" data-side="target">2. Цель</button>
      </div>
      <div id="up-stake-pane" class="sub">
        <div class="coin-row">
          <label for="up-coins" class="lead">Монеты</label>
          <input class="field" id="up-coins" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
          <button type="button" class="mini" id="up-coins-max">Всё</button>
        </div>
        <div class="grid small" id="up-inv"></div>
      </div>
      <div id="up-target-pane" class="sub" hidden>
        <div class="mult up-mults" id="up-mults"></div>
        <div class="grid small" id="up-targets"></div>
      </div>
      <p class="note" id="up-note"></p>
    </section>

    <!-- КОНТРАКТЫ -->
    <section class="screen" id="screen-contract" data-tab="contract" hidden>
      <div class="ct-card">
        <div class="ct-head"><b id="ct-count">0 / 10</b><small>предметов любой редкости, от 3 до 10</small><button type="button" class="mini" id="ct-clear">Очистить</button></div>
        <div class="ct-slots" id="ct-slots"></div>
        <div class="ct-sum" id="ct-sum"></div>
        <button class="btn-spin small" id="ct-go" type="button" disabled><span>ПОДПИСАТЬ КОНТРАКТ</span></button>
      </div>
      <div class="col-tools">
        <div class="chips" id="ct-chips"></div>
      </div>
      <div class="grid small" id="ct-grid"></div>
      <p class="note" id="ct-note"></p>
    </section>

    <!-- ИНВЕНТАРЬ -->
    <section class="screen" id="screen-inventory" data-tab="inventory" hidden>
      <div class="col-head">
        <div><small>Места</small><b id="col-slots">0 / 200</b></div>
        <div><small>Стоимость</small><b id="col-value">0 ₽</b><i id="col-week"></i></div>
        <button class="btn-ghost" id="col-select" type="button">Выбрать</button>
      </div>
      <div class="banner" id="overflow-banner" hidden></div>
      <div class="sell-quick" id="sell-quick"></div>
      <div class="chips" id="col-chips"></div>
      <div class="col-tools">
        <label class="search"><span class="sr">Поиск</span><input id="col-search" type="search" placeholder="Поиск: AK-47, Fade…"></label>
        <label><span class="sr">Сортировка</span>
          <select id="col-sort">
            <option value="new">Новые</option>
            <option value="price">Дорогие</option>
            <option value="cheap">Дешёвые</option>
            <option value="tier">Редкие</option>
            <option value="growth">Выросли</option>
          </select>
        </label>
      </div>
      <div class="grid" id="col-grid"></div>
      <p class="empty" id="col-empty" hidden>Пока пусто. Открой кейс на вкладке «Кейсы».</p>
    </section>

    <!-- ЕЩЁ -->
    <section class="screen" id="screen-more" data-tab="more" hidden>
      <div id="more-home" class="screen">
        <div class="profile-card" id="profile"></div>
        <div class="tiles-menu" id="more-menu"></div>
      </div>
      <div id="more-page" class="screen" hidden></div>
    </section>
  </main>

  <div class="selbar" id="selbar" hidden>
    <span id="sel-info">0 шт.</span>
    <button type="button" id="sel-ct">В контракт</button>
    <button type="button" id="sel-up">В апгрейд</button>
    <button type="button" class="primary" id="sel-sell">Продать</button>
  </div>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="cases" class="on"><i>▣</i>Кейсы</button>
    <button type="button" data-tab="upgrade"><i>⤴</i>Апгрейды</button>
    <button type="button" data-tab="contract"><i>⧉</i>Контракты</button>
    <button type="button" data-tab="inventory"><i>▦</i>Инвентарь</button>
    <button type="button" data-tab="more"><i>⋯</i>Ещё</button>
  </nav>

  <div class="overlay" id="reel-overlay" hidden>
    <div class="reels" id="reels"></div>
    <button class="btn-ghost skip" id="reel-skip" type="button">Пропустить</button>
  </div>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-body" id="sheet-body"></div></div>

  <div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-action" hidden></button></div>
</div>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
